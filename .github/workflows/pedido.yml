# workflow). Quem atende é o Mac, com atender.py: a Amazon recusa buscas
# vindas dos servidores do GitHub.
name: Pedido de pesquisa

on:
  workflow_dispatch:

jobs:
  pedido:
    runs-on: ubuntu-latest
    steps:
      - run: echo "Pedido registrado; o Mac atende em até 2 minutos se estiver ligado."
