<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Dig! Discover · DigAmazon</title>
<script>
  // aplica o tema escolhido antes de pintar a página, para não piscar
  try { const t = localStorage.getItem("digamazon.tema"); if (t === "light" || t === "dark") document.documentElement.dataset.theme = t; } catch (e) {}
</script>
<meta name="theme-color" content="#ffffff">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 48 48'%3E%3Crect width='48' height='48' rx='11' fill='%23103028'/%3E%3Ccircle cx='24' cy='24' r='15' fill='none' stroke='%23c8f850' stroke-width='3'/%3E%3Ccircle cx='24' cy='24' r='4' fill='%23c8f850'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400..800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="estilo.css?v=3.0">
</head>
<body>
<header class="topo">
  <div class="linha">
    <div>
      <h1><a href="./" class="logo"><i class="marca" aria-hidden="true"></i><b>Dig<span>Amazon</span></b></a></h1>
      <div class="sub" id="sub"></div>
    </div>
    <nav class="acoes-topo"><a class="link-topo" href="./">← DigAmazon</a></nav>
  </div>
  <div id="status" role="status"></div>
</header>

<main>
  <h2>Dig! Discover <span class="conta" id="conta"></span></h2>
  <p class="nota">Vinis abaixo de R$ 150 com nota da crítica de 85 ou mais no Metacritic.</p>
  <div class="filtros">
    <input id="filtro" type="search" placeholder="Buscar" autocomplete="off">
    <select id="ordem" aria-label="Ordenar">
      <option value="entrada">Por ordem de entrada</option>
      <option value="score">Por score</option>
      <option value="preco">Por preço</option>
    </select>
  </div>
  <div class="grade" id="discos"></div>
</main>

<footer class="rodape">DigAmazon · versão 3.0</footer>

<script src="comum.js?v=3.0"></script>
<script>
const PLAY = '<svg viewBox="0 0 12 12" aria-hidden="true"><path d="M2 1l9 5-9 5z"/></svg>';

// O cartão leva à Amazon; o Escutar abre o disco no Bandcamp (ou a busca, se não foi achado lá).
function card(d, novo) {
  const caixa = document.createElement("div");
  caixa.className = "disco" + (novo ? " novo" : "");
  const a = document.createElement("a"); a.className = "ir";
  a.href = "https://www.amazon.com.br/dp/" + d.asin;
  a.target = "_blank"; a.rel = "noopener";
  const capa = document.createElement("div"); capa.className = "capa";
  if (d.foto) { const img = document.createElement("img"); img.src = capaGrande(d.foto); img.alt = ""; img.loading = "lazy"; capa.append(img); }
  const info = document.createElement("div"); info.className = "info";
  const t = document.createElement("div"); t.className = "titulo"; t.textContent = d.titulo;
  const ar = document.createElement("div"); ar.className = "artista"; ar.textContent = [d.artista, d.ano].filter(Boolean).join(" · ");
  const c = document.createElement("div"); c.className = "critica"; c.append("Metacritic "); const n = document.createElement("b"); n.textContent = d.nota; c.append(n);
  const p = document.createElement("div"); p.className = "preco"; p.textContent = real(d.preco);
  info.append(t, ar, c, p); a.append(capa, info);
  const ouvir = document.createElement("a"); ouvir.className = "escutar";
  ouvir.href = d.bandcamp || "https://bandcamp.com/search?item_type=a&q=" + encodeURIComponent(`${d.artista} ${d.titulo}`);
  ouvir.target = "_blank"; ouvir.rel = "noopener";
  ouvir.innerHTML = PLAY + "Escutar";
  caixa.append(a, ouvir);
  return caixa;
}

// Entrou no Dig! Discover quando o disco apareceu na faixa de preço ou ganhou a nota, o que veio depois.
const entrada = d => [d.visto, d.nota_desde].filter(Boolean).map(q => q.slice(0, 16)).sort().pop() || "";
const ORDENS = {
  entrada: (a, b) => entrada(b).localeCompare(entrada(a)) || b.nota - a.nota,
  score: (a, b) => b.nota - a.nota || a.preco - b.preco,
  preco: (a, b) => a.preco - b.preco,
};
function mostrar() {
  const novos = new Set(dados.novos);
  const q = $("filtro").value.trim().toLowerCase();
  const dig = dados.discos.filter(d => d.nota >= DIG);
  const lista = dig.filter(d => !q || (d.titulo + " " + d.artista).toLowerCase().includes(q)).sort(ORDENS[$("ordem").value]);
  $("conta").textContent = q ? `${lista.length} de ${dig.length}` : `${dig.length}`;
  const g = $("discos");
  if (lista.length) g.replaceChildren(...lista.map(d => card(d, novos.has(d.asin))));
  else g.innerHTML = `<div class="vazio">${q ? "Nenhum disco com esse nome." : "Nenhum disco com nota 85 ou mais por enquanto."}</div>`;
}

$("filtro").addEventListener("input", mostrar);
$("ordem").addEventListener("change", mostrar);
iniciar();
</script>
</body>
</html>
