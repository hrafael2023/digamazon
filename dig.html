<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Dig! Records · DigAmazon</title>
<meta name="theme-color" content="#16130f">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 48 48'%3E%3Ccircle cx='24' cy='24' r='22' fill='%2316130f'/%3E%3Ccircle cx='24' cy='24' r='8' fill='%23f08a00'/%3E%3Ccircle cx='24' cy='24' r='2' fill='%23fff'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="estilo.css?v=1.3">
</head>
<body>
<header class="topo">
  <div class="linha">
    <div>
      <h1>Dig! <span>Records</span></h1>
      <div class="sub" id="sub">nota 85 ou mais no Metacritic</div>
    </div>
    <nav class="acoes-topo"><a class="link-topo" href="./">← DigAmazon</a></nav>
  </div>
  <div id="status" role="status"></div>
</header>

<main>
  <h2>Os mais bem avaliados <span class="conta" id="conta"></span></h2>
  <p class="nota">Vinis abaixo de R$ 150 com nota da crítica de 85 ou mais, da maior para a menor.</p>
  <div class="grade" id="discos"></div>
</main>

<footer class="rodape">DigAmazon · versão 1.3</footer>

<script>
const DIG = 85;  // o mesmo corte do selo na página principal
const $ = id => document.getElementById(id);
const real = n => n.toLocaleString("pt-BR", { style: "currency", currency: "BRL" });

function card(d, novo) {
  const a = document.createElement("a");
  a.className = "disco" + (novo ? " novo" : "");
  a.href = "https://www.amazon.com.br/dp/" + d.asin;
  a.target = "_blank"; a.rel = "noopener";
  const capa = document.createElement("div"); capa.className = "capa";
  if (d.foto) { const img = document.createElement("img"); img.src = d.foto.replace(/\._AC_[^.]*_\./, "._AC_SL400_."); img.alt = ""; img.loading = "lazy"; capa.append(img); }
  const info = document.createElement("div"); info.className = "info";
  const t = document.createElement("div"); t.className = "titulo"; t.textContent = d.titulo;
  const ar = document.createElement("div"); ar.className = "artista"; ar.textContent = [d.artista, d.ano].filter(Boolean).join(" · ");
  const c = document.createElement("div"); c.className = "critica"; c.textContent = `Metacritic ${d.nota}`;
  const p = document.createElement("div"); p.className = "preco"; p.textContent = real(d.preco);
  info.append(t, ar, c, p); a.append(capa, info);
  return a;
}

async function carregar() {
  const r = await fetch("dados.json?t=" + Date.now(), { cache: "no-store" });
  if (!r.ok) throw new Error("não consegui abrir os dados (" + r.status + ")");
  const dados = await r.json();
  const novos = new Set(dados.novos);
  const lista = dados.discos.filter(d => d.nota >= DIG).sort((a, b) => b.nota - a.nota || a.preco - b.preco);
  $("conta").textContent = lista.length;
  const g = $("discos");
  if (lista.length) g.replaceChildren(...lista.map(d => card(d, novos.has(d.asin))));
  else g.innerHTML = '<div class="vazio">Nenhum disco com nota 85 ou mais por enquanto.</div>';
}

carregar().catch(e => { $("status").textContent = e.message; $("status").classList.add("erro"); });
</script>
</body>
</html>
