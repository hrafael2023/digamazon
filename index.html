<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>DigAmazon</title>
<script>
  // aplica o tema escolhido antes de pintar a página, para não piscar
  try { const t = localStorage.getItem("digamazon.tema"); if (t === "light" || t === "dark") document.documentElement.dataset.theme = t; } catch (e) {}
</script>
<meta name="theme-color" content="#16130f">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 48 48'%3E%3Ccircle cx='24' cy='24' r='22' fill='%2316130f'/%3E%3Ccircle cx='24' cy='24' r='8' fill='%23f08a00'/%3E%3Ccircle cx='24' cy='24' r='2' fill='%23fff'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="estilo.css?v=1.17">
</head>
<body>
<header class="topo">
  <div class="linha">
    <div>
      <h1><a href="./" class="logo">Dig<span>Amazon</span></a></h1>
      <div class="sub" id="sub"></div>
    </div>
    <nav class="acoes-topo">
      <a class="link-topo" href="dig.html">Dig! Discover</a>
      <button id="pesquisar" type="button"><span class="gira"></span><span id="rotulo">Dig</span></button>
    </nav>
  </div>
  <div id="status" role="status"></div>
</header>

<main>
  <h2>Novos discos <span class="conta" id="conta-novos"></span>
    <button type="button" class="tema" id="tema" aria-label="Alternar tema claro/escuro">
      <svg viewBox="0 0 20 20" aria-hidden="true">
        <circle cx="10" cy="10" r="8" fill="none" stroke="currentColor" stroke-width="1.5"/>
        <path d="M10 2a8 8 0 0 1 0 16z" fill="currentColor"/>
      </svg>
    </button>
  </h2>
  <p class="nota">Discos que entraram na faixa de preço na última pesquisa.</p>
  <div class="grade" id="novos"></div>

  <div class="separador">lista completa</div>

  <h2 id="topo-todos">Todos abaixo de R$ 150 <span class="conta" id="conta-todos"></span></h2>
  <div class="filtros">
    <input id="filtro" type="search" placeholder="Filtrar por disco ou artista" autocomplete="off">
    <select id="ordem" aria-label="Ordenar">
      <option value="preco">Menor preço</option>
      <option value="preco-desc">Maior preço</option>
      <option value="nome">A–Z</option>
    </select>
  </div>
  <div class="grade" id="todos"></div>
  <nav class="paginas" id="paginas" aria-label="Páginas"></nav>
</main>

<footer class="rodape">DigAmazon · versão 1.17</footer>

<script src="comum.js?v=1.17"></script>
<script>
// Estrela de 10 pontas; gira por trás do texto, que fica parado.
const ESTRELA = '<svg viewBox="0 0 100 100" aria-hidden="true"><polygon points="50,0 61.4,14.8 79.4,9.5 79.9,28.3 97.6,34.5 87,50 97.6,65.5 79.9,71.7 79.4,90.5 61.4,85.2 50,100 38.6,85.2 20.6,90.5 20.1,71.7 2.4,65.5 13,50 2.4,34.5 20.1,28.3 20.6,9.5 38.6,14.8"/></svg><b>Dig!</b>';

function card(d, novo) {
  const a = document.createElement("a");
  a.className = "disco" + (novo ? " novo" : "");
  a.href = "https://www.amazon.com.br/dp/" + d.asin;
  a.target = "_blank"; a.rel = "noopener";
  const capa = document.createElement("div"); capa.className = "capa";
  if (d.foto) { const img = document.createElement("img"); img.src = capaGrande(d.foto); img.alt = ""; img.loading = "lazy"; capa.append(img); }
  if (d.nota >= DIG) {
    const selo = document.createElement("span"); selo.className = "dig"; selo.innerHTML = ESTRELA;
    selo.title = `Metacritic ${d.nota}`; selo.setAttribute("aria-label", `Dig! Nota ${d.nota} no Metacritic`);
    a.append(selo);
  }
  const info = document.createElement("div"); info.className = "info";
  const t = document.createElement("div"); t.className = "titulo"; t.textContent = d.titulo;
  const ar = document.createElement("div"); ar.className = "artista"; ar.textContent = [d.artista, d.ano].filter(Boolean).join(" · ");
  const p = document.createElement("div"); p.className = "preco"; p.textContent = real(d.preco);
  info.append(t, ar, p); a.prepend(capa, info);
  return a;
}

const POR_PAGINA = 300;
let pagina = 1;

function mostrarTodos() {
  if (!dados) return;
  const q = $("filtro").value.trim().toLowerCase();
  const novos = new Set(dados.novos);
  let lista = dados.discos.filter(d => !q || (d.titulo + " " + d.artista).toLowerCase().includes(q));
  const ordem = $("ordem").value;
  if (ordem === "preco-desc") lista = lista.slice().sort((a, b) => b.preco - a.preco);
  if (ordem === "nome") lista = lista.slice().sort((a, b) => (a.artista || a.titulo).localeCompare(b.artista || b.titulo, "pt-BR"));
  const total = Math.max(1, Math.ceil(lista.length / POR_PAGINA));
  pagina = Math.min(pagina, total);
  const trecho = lista.slice((pagina - 1) * POR_PAGINA, pagina * POR_PAGINA);
  const g = $("todos"); g.replaceChildren(...trecho.map(d => card(d, novos.has(d.asin))));
  $("conta-todos").textContent = q ? `${lista.length} de ${dados.discos.length}` : `${dados.discos.length}`;
  if (!lista.length) g.innerHTML = '<div class="vazio">Nenhum disco com esse nome.</div>';
  paginas(total);
}

function paginas(total) {
  const nav = $("paginas");
  nav.replaceChildren();
  if (total < 2) return;
  const botao = (rotulo, n, atual) => {
    const b = document.createElement("button"); b.type = "button"; b.textContent = rotulo;
    if (atual) b.setAttribute("aria-current", "page");
    b.disabled = n < 1 || n > total || atual;
    b.addEventListener("click", () => irPara(n));
    return b;
  };
  nav.append(botao("‹", pagina - 1));
  for (let n = 1; n <= total; n++) nav.append(botao(String(n), n, n === pagina));
  nav.append(botao("›", pagina + 1));
}

function irPara(n) {
  pagina = n;
  mostrarTodos();
  $("topo-todos").scrollIntoView({ behavior: "smooth" });
}

function mostrar() {
  const porAsin = new Map(dados.discos.map(d => [d.asin, d]));
  const novos = dados.novos.map(a => porAsin.get(a)).filter(Boolean);
  $("conta-novos").textContent = novos.length ? `${novos.length}` : "";
  const g = $("novos");
  if (novos.length) g.replaceChildren(...novos.map(d => card(d, true)));
  else g.innerHTML = `<div class="vazio">${dados.primeira
    ? "Esta foi a primeira pesquisa. Os próximos discos que entrarem na faixa aparecem aqui."
    : "Nenhum disco novo desde a pesquisa anterior."}</div>`;
  mostrarTodos();
}

// Tema: alterna entre claro e escuro e lembra a escolha neste navegador.
const raiz = document.documentElement, sistemaEscuro = matchMedia("(prefers-color-scheme: dark)");
const temaAtual = () => raiz.dataset.theme || (sistemaEscuro.matches ? "dark" : "light");
const marcarTema = () => {
  raiz.dataset.temaEfetivo = temaAtual();
  $("tema").setAttribute("aria-pressed", temaAtual() === "dark");
};
$("tema").addEventListener("click", () => {
  raiz.dataset.theme = temaAtual() === "dark" ? "light" : "dark";
  try { localStorage.setItem("digamazon.tema", raiz.dataset.theme); } catch (e) {}
  marcarTema();
});
sistemaEscuro.addEventListener("change", marcarTema);
marcarTema();

// Mudou a busca ou a ordem: volta para a primeira página.
$("filtro").addEventListener("input", () => { pagina = 1; mostrarTodos(); });
$("ordem").addEventListener("change", () => { pagina = 1; mostrarTodos(); });
iniciar();
</script>
</body>
</html>
